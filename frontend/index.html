<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Voice Assistant</title>

    <link
        rel="stylesheet"
        href="style.css">
</head>

<body>

    <div id="character">

        <div id="face">

            <div class="eye" id="leftEye"></div>
            <div class="eye" id="rightEye"></div>

            <div id="nose"></div>

            <div id="mouth"></div>

        </div>

    </div>

    <button id="recordBtn">
        Start Recording
    </button>

    <button id="resetBtn">
        Reset Memory
    </button>

    <div id="status">Ready</div>

    <div id="response"></div>

    <script src="app.js"></script>

</body>

</html>
